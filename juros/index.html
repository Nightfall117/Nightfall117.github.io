<!DOCTYPE html>
<html lang="pt-br">
 
  <head>
   
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <title>Juros Compostos</title>
   
    <link rel="stylesheet" href="css/style.css" />
   
  </head>
 
  <body>
   
    <h1>Calculadora de Juros Compostos</h1>
   
    <div id="calculadora">
     
      <div id="calculo">
        <p>
          <div class="linha">
            Valor inicial
          </div>
          <div class="input">
            <input type="number"id="valorInicial"/>
          </div>
          
        </p>
       
        <p>
          <div class="linha">
            Taxa de juros
          </div>
          <div class="input">
            <input type="number" id="taxaJuros"/> 
          </div>
        </p>
       
        <p>
          <div class="linha">
            Tempo em anos 
        </div>
        <div class="input">
          <input type="number" id="tempo"/>
        </div>
        </p>
       
        <p>
          <div class="linha">
            Aporte Mensal
          </div>
          <div class="input">
            <input type="number" id="aporteMensal"/>
          </div>
        </p>
       
        <p>
          <button onclick="calcularMontante()">Calcular</button>
         
        </p>
       
        <p id="resultado"></p>
      </div>
    </div>
   
    <script src="js/calc.js"></script>
   
  </body>
</html>
