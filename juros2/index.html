<!DOCTYPE html>
<html lang="pt-br">
 
  <head>
   
    <meta charset="UTF-8" />
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <title>Juros Compostos</title>
   
    <link rel="stylesheet" href="css/style.css" />
   
  </head>
 
  <body>
    <div id="geral">
      <h1>Calculadora de Juros Compostos</h1>
      <div class="input-group">
        <label for="valorInicial">Aporte inicial</label>
        <input type="number" id="valorInicial" placeholder="Digite o valor inicial" />
      </div>
      <div class="input-group">
        <label for="taxaJuros">Taxa de Juros Anual:</label>
        <input type="number" id="taxaJuros" placeholder="Digite de rendimento anual" />
      </div>
      <div class="input-group">
        <label for="tempo">Tempo em Anos:</label>
        <input type="number" id="tempo" placeholder="Tempo de investemponto" />
      </div>
      <div class="input-group">
        <label for="aporteMensal">Aporte mensal:</label>
        <input type="number" id="aporteMensal" placeholder="Valor guardado por mês" />
      </div>
      <button id="calcular" >Calcular</button>
      <div id="resultado"></div>
    </div>
   
     
   
  </body>
<script src="js/calc.js"></script>
</html>
